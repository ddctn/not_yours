<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Не твоё — социальный проект о стереотипах и выборе профессии."
    />
    <title>Не твоё? — социальный проект</title>
    <link rel="stylesheet" href="./stylesheets/style.css" />
    <script src="./js/main.js" defer></script>
  </head>
  <body>
    <div
      class="preloader"
      id="preloader"
      aria-label="Загрузка сайта"
      role="status"
    >
      <div class="preloader__visual">
        <div class="preloader_card preloader_card--1">
          <div class="preloader_card__inner">
            <img src="./assets/cards/hand-down.png" alt="" />
            <div class="preloader_card__bg preloader_card__bg--1"></div>
          </div>
        </div>
        <div class="preloader_card preloader_card--2">
          <div class="preloader_card__inner">
            <img src="./assets/cards/car.png" alt="" />
            <div class="preloader_card__bg preloader_card__bg--2"></div>
          </div>
        </div>
        <div class="preloader_card preloader_card--3">
          <div class="preloader_card__inner">
            <img src="./assets/cards/chem.png" alt="" />
            <div class="preloader_card__bg preloader_card__bg--3"></div>
          </div>
        </div>
        <div class="preloader__number" id="loadingPercent">0%</div>
      </div>
    </div>
  <main class="main">
    <div class="menu">
      <a href="#" class="menu_item">о проекте</a>
      <a href="#" class="menu_item">игра</a>
      <a href="#" class="menu_item">советы</a>
    </div>
    <div class="main__cards">

      <div class="main__card main__card--1">
        <div class="main__card-inner">
          <img src="./assets/cards/hand-down.png" alt="">
          <div class="main__card-bg main__card-bg--1"></div>
        </div>
      </div>

      <div class="main__card main__card--2">
        <div class="main__card-inner">
          <img src="./assets/cards/car.png" alt="">
          <div class="main__card-bg main__card-bg--2"></div>
        </div>
      </div>

      <div class="main__card main__card--3">
        <div class="main__card-inner">
          <img src="./assets/cards/chem.png" alt="">
          <div class="main__card-bg main__card-bg--3"></div>
        </div>
      </div>

    </div>
</main>
  </body>
</html>
